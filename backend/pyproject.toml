[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-verify-backend"
version = "2.1.0"
description = "Backend API for Stock Verify Application"
authors = [{ name = "Stock Verify Team", email = "admin@stockverify.internal" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "gunicorn>=25.1.0",
    "pydantic>=2.12.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ignore E402 (module level import not at top of file) globally due to conditional import needs
ignore = ["E402"]
# B: bugbear (exception chaining, mutable defaults, ...), RUF006: dangling
# asyncio tasks, RUF100: stale noqa comments.
extend-select = ["B", "RUF006", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection callables are intentionally used as defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Cookie",
    "fastapi.Security",
    # Repo-local dependency factories that return / wrap fastapi.Depends
    "backend.auth.permissions.require_permission",
    "backend.auth.dependencies.require_permissions",
    "backend.auth.dependencies.require_role",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = [
    "^backend/scripts/",
    "^backend/tests/",
]

[[tool.mypy.overrides]]
module = [
    "copilotkit.*",
    "psutil.*",
    "pandas.*"
]
ignore_missing_imports = true
