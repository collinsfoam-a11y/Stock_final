apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: stock-verify
type: Opaque
stringData:
  mongodb-url: "mongodb://stock_app:YOUR_MONGO_PASSWORD@mongo:27017/stock_verification?authSource=stock_verification"
  jwt-secret: "YOUR_JWT_SECRET_HERE"
  jwt-refresh-secret: "YOUR_JWT_REFRESH_SECRET_HERE"
  redis-url: "redis://:YOUR_REDIS_PASSWORD@redis:6379/0"
