[mypy]
explicit_package_bases = True
mypy_path = .
implicit_optional = True
plugins = pydantic.mypy
exclude = ^backend[\\/](scripts|tests)[\\/]

[mypy-backend.tests.*]
ignore_errors = True

[mypy-backend.scripts.*]
ignore_errors = True

# Mixin modules - attrs are defined in the composing class at runtime
[mypy-backend.services.sync.realtime]
disable_error_code = attr-defined

[mypy-backend.services.sync.nightly]
disable_error_code = attr-defined

[mypy-backend.services.sync.discovery]
disable_error_code = attr-defined

[mypy-backend.services.sql_sync_service]
disable_error_code = attr-defined, misc

[mypy-backend.services.governance_guard]
disable_error_code = attr-defined

[mypy-backend.services.approval_engine]
disable_error_code = attr-defined

[mypy-backend.services.error_log]
disable_error_code = attr-defined

[mypy-backend.services.analytics_service]
disable_error_code = index, attr-defined, operator

[mypy-backend.services.search_service]
disable_error_code = has-type, var-annotated, arg-type

[mypy-backend.core.uow]
disable_error_code = attr-defined

[mypy-backend.db.migrations]
disable_error_code = arg-type
