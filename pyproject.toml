[tool.bandit]
# Skip tests that produce false positives in this codebase
skips = ["B101", "B105", "B110", "B112", "B311", "B404", "B603", "B607", "B608"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510", "DTZ005", "SIM103", "UP045", "RUF010", "ARG001", "TRY003", "F841", "E501"]
