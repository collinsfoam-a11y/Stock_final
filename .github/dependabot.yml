version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      security-patches:
        patterns:
          - "cryptography"
          - "PyJWT"
          - "authlib"
          - "passlib"
          - "bcrypt"
          - "python-multipart"
    ignore:
      # bcrypt pinned <4.1 due to passlib 1.7.x compat (see requirements.production.txt)
      - dependency-name: "bcrypt"
        versions: [">=4.1"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
      react-native:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native*"
      testing:
        patterns:
          - "jest*"
          - "@jest/*"
          - "@testing-library/*"
          - "@playwright/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
